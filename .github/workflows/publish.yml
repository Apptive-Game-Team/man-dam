name: publish

on:
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 깨진 :latest를 올리는 것보다 여기서 멈추는 게 낫다.
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q

      # 러너 기본 빌더는 docker 드라이버라 캐시 export를 못 한다. buildx가
      # docker-container 드라이버를 깔아줘야 cache-to: type=gha 가 동작한다.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 소문자로 고정한다. 조직 이름은 Apptive-Game-Team이지만 GHCR 경로는 소문자만 받는다.
          tags: |
            ghcr.io/apptive-game-team/man-dam:latest
            ghcr.io/apptive-game-team/man-dam:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
