  <circle cx="20" cy="44" r="4" fill="#1f2933"/><circle cx="37" cy="44" r="4" fill="#1f2933"/>
  <path d="M18 59 L39 59" stroke="#1f2933" stroke-width="6" stroke-linecap="round"/>
  <g class="pnt-arm">
    <path d="M38 83 Q62 67 88 67" fill="none" stroke="#1f2933" stroke-width="20" stroke-linecap="round"/>
    <path d="M38 83 Q62 67 88 67" fill="none" stroke="#f0a84a" stroke-width="13" stroke-linecap="round"/>
    <path d="M85 67 L115 67" stroke="#1f2933" stroke-width="12" stroke-linecap="round"/>
    <path d="M85 67 L115 67" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M90 66 L104 54" stroke="#1f2933" stroke-width="10" stroke-linecap="round"/>
    <path d="M90 66 L104 54" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path class="pnt-marks" d="M104 29 L116 21 M108 40 L118 39 M101 19 L105 5" stroke="#1f2933" stroke-width="7" stroke-linecap="round"/>
</svg>
