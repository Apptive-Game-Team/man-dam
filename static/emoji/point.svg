<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title">
  <title id="title">팔을 뻗어 검지로 삿대질하는 동작</title>
  <style>
    @keyframes pnt-arm-move { 0%, 50%, 100% { transform: translateX(-12px) } 25%, 75% { transform: translateX(10px) } }
    @keyframes pnt-marks-blink { 0%, 50%, 100% { opacity: .2 } 25%, 75% { opacity: 1 } }
    .pnt-arm { animation: pnt-arm-move 1s infinite; transform-box: view-box; }
    .pnt-marks { animation: pnt-marks-blink 1s infinite; opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .pnt-arm { animation: none; }
      .pnt-marks { animation: none; }
    }
  </style>
  <path d="M5 116 L9 77 Q26 66 46 75 L57 116Z" fill="#f0a84a" stroke="#1f2933" stroke-width="7" stroke-linejoin="round"/>
