<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title">
  <title id="title">차렷한 채 굳어 한숨 쉬는 동작</title>
  <style>
    @keyframes blk-lines-move { 0%, 100% { transform: translateY(-2px) } 50% { transform: translateY(2px) } }
    @keyframes blk-body-move { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(5px) } }
    @keyframes blk-sigh-move { 0% { transform: translate(-6px, 4px); opacity: 0 } 45% { opacity: 1 } 100% { transform: translate(20px, -3px); opacity: 0 } }
    .blk-lines { animation: blk-lines-move 1.2s infinite; transform-box: view-box; }
    .blk-body { animation: blk-body-move 1.2s infinite; transform-box: view-box; }
    .blk-sigh { animation: blk-sigh-move 1.2s infinite; transform-box: view-box; opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .blk-lines { animation: none; }
      .blk-body { animation: none; }
      .blk-sigh { animation: none; }
    }
  </style>
  <g class="blk-lines" fill="none" stroke="#1f2933" stroke-width="6" stroke-linecap="round">
    <path d="M44 2 V29 M52 2 V29 M60 2 V29 M68 2 V29 M76 2 V29"/>
  </g>
  <g class="blk-body">
    <path d="M31 116 L34 78 Q60 68 86 78 L89 116Z" fill="#f0a84a" stroke="#1f2933" stroke-width="7" stroke-linejoin="round"/>
    <path d="M39 85 L39 113 M81 85 L81 113" fill="none" stroke="#1f2933" stroke-width="18" stroke-linecap="round"/>
    <path d="M39 85 L39 113 M81 85 L81 113" fill="none" stroke="#f0a84a" stroke-width="11" stroke-linecap="round"/>
    <circle cx="60" cy="49" r="29" fill="#2ec4b6" stroke="#1f2933" stroke-width="7"/>
    <circle cx="50" cy="49" r="4" fill="#1f2933"/><circle cx="70" cy="49" r="4" fill="#1f2933"/>
    <path d="M48 64 L72 64" stroke="#1f2933" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g class="blk-sigh" fill="#ffffff" stroke="#1f2933" stroke-width="4" stroke-linejoin="round">
    <path d="M83 78 C77 78 74 74 74 69 C74 64 78 60 83 60 C86 60 88 61 90 63 C94 58 100 56 106 57 C115 58 120 63 120 68 C120 75 112 80 101 80 C94 80 88 79 83 78Z"/>
  </g>
</svg>
